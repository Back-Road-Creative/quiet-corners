[project]
name = "svc-quiet-corners"
version = "2.0.0"
description = "Quiet Corners of America — census-driven rural stability pipeline"
requires-python = ">=3.12"
dependencies = [
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
# Floor set 2 points under the measured 57% (2026-07-30) — raise as it climbs.
addopts = "--cov=src --cov-fail-under=55"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S"]
ignore = ["E501", "S404", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S311"]

[tool.mypy]
python_version = "3.12"
exclude = ["tests/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# tests/ is a package (`tests/__init__.py`), so `exclude` alone does not keep
# mypy from pulling it in during recursive discovery. Same shape as
# the other services' mypy overrides.
[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
